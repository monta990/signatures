name: Signatures Security

on:
  push:
    branches:
      - main
      - "ci/**"
      - "security/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signatures-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - php
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  glpi-aware-quality:
    name: GLPI-aware PHP, Twig and style checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Signatures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout GLPI 12 development toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: 12.0/bugfixes
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: bcmath, curl, dom, gd, intl, mbstring, mysqli, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install             --no-interaction             --prefer-dist             --no-progress             --ignore-platform-req=php+             --no-scripts

      - name: Prepare GLPI plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/signatures
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='glpi/'             "$GITHUB_WORKSPACE/"             "$GITHUB_WORKSPACE/glpi/plugins/signatures/"

      - name: PHP lint with deprecated syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint             --show-deprecated             --colors             plugins/signatures/setup.php             plugins/signatures/src

      - name: PHP-CS-Fixer baseline — GLPI @PER-CS3x0
        env:
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set +e
          glpi/vendor/bin/php-cs-fixer check             --config=.github/php-cs-fixer-signatures.php             --using-cache=no             --diff             > "$RUNNER_TEMP/php-cs-fixer-signatures.log" 2>&1
          fixer_status=$?
          set -e
          cat "$RUNNER_TEMP/php-cs-fixer-signatures.log"

          findings="$(sed -nE 's/^.*Found ([0-9]+) of [0-9]+ files that can be fixed.*$/\1/p' "$RUNNER_TEMP/php-cs-fixer-signatures.log" | tail -n 1)"
          if [[ -z "$findings" ]]; then
            if [[ "$fixer_status" -eq 0 ]]; then
              findings=0
            else
              echo "PHP-CS-Fixer failed before reporting a result." >&2
              exit "$fixer_status"
            fi
          fi

          baseline=12
          if (( findings > baseline )); then
            echo "PHP style findings increased: $findings files need fixing (baseline: $baseline)." >&2
            exit 1
          fi
          echo "PHP style baseline: $findings/$baseline files need formatting; no increase detected."

      - name: Enforce GLPI style on newly added runtime PHP files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t new_php < <(
            git diff --name-only --diff-filter=A "$BASE_SHA" "$GITHUB_SHA"               | grep -E '^(setup\.php|src/.+\.php)$' || true
          )
          if [[ ${#new_php[@]} -eq 0 ]]; then
            echo "No new runtime PHP files; the legacy formatting baseline remains unchanged."
            exit 0
          fi
          glpi/vendor/bin/php-cs-fixer check             --config=.github/php-cs-fixer-signatures.php             --path-mode=intersection             --using-cache=no             --diff             "${new_php[@]}"

      - name: Enforce GLPI Twig rules on changed templates
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: glpi
        run: |
          set -euo pipefail
          mapfile -t changed_twig < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA"               | grep -E '^templates/.+\.twig$'               | sed 's#^#plugins/signatures/#' || true
          )
          if [[ ${#changed_twig[@]} -eq 0 ]]; then
            echo "No changed Twig templates."
            exit 0
          fi
          vendor/bin/twigcs             --ansi             --no-interaction             --ruleset='Glpi\Tools\GlpiTwigRuleset'             "${changed_twig[@]}"

  gitleaks:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  workflow-audit:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          persona: regular
          min-severity: medium
          min-confidence: medium
